<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game 3D</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="video-popup" id="videoPopup">
        <div class="video-popup-header" id="videoPopupHeader">
            <span>YouTube</span>
            <div class="video-popup-actions">
                <button id="videoMinimizeBtn" aria-label="Toggle video size">&#9644;</button>
                <button id="videoCloseBtn" aria-label="Close video">&times;</button>
            </div>
        </div>
        <div class="video-popup-body">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/IDuVwQFNm3Y?si=v-M7L4lIGnkCuexS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="video-resizer" id="videoResizer" aria-label="Resize video panel"></div>
    </div>

    <!-- Wrapper cho layout dọc -->
    <div class="game-wrapper">
        <!-- Bảng điểm nằm tách biệt phía trên -->
        <div class="hud-panel">
            <div class="score-box">SCORE: <span id="score">0</span></div>
            <div class="title-small">NEON SNAKE</div>
            <div class="level-box">LEVEL: <span id="level">1</span></div>
        </div>

        <!-- Khung màn hình game -->
        <div class="game-container">
            <div class="ui-layer">
                <div id="start-screen" class="screen active">
                    <h1 class="glitch" data-text="NEON SNAKE">NEON SNAKE</h1>
                    <p>Điều khiển bằng phím mũi tên, WASD hoặc vuốt trên mobile</p>
                    <p>Chinh phục hơn 100 màn với chướng ngại nâng cấp liên tục!</p>
                    
                    <div class="level-select-container">
                        <label for="start-level">START LEVEL:</label>
                        <input type="number" id="start-level" min="1" max="200" value="1" class="level-input">
                    </div>

                    <button id="start-btn" class="btn">START GAME</button>
                </div>

                <div id="game-over-screen" class="screen hidden">
                    <h1>GAME OVER</h1>
                    <p>Final Score: <span id="final-score">0</span></p>
                    <div class="btn-group">
                        <button id="restart-btn" class="btn">RETRY LEVEL</button>
                        <button id="home-btn" class="btn">MAIN MENU</button>
                    </div>
                </div>

                <div id="level-up-screen" class="screen hidden">
                    <h1>LEVEL COMPLETE!</h1>
                    <p>Next Level Starting...</p>
                </div>
            </div>
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>
        
        <!-- Hướng dẫn / Footer nhỏ -->
        <div class="controls-hint">
            ARROWS / WASD • Swipe on Mobile • 200 Levels
            <button id="autoplay-btn" class="btn small" type="button">AUTO PLAY: OFF</button>
        </div>
        <div class="mobile-controls">
            <div class="control-row">
                <button class="control-btn" data-dir="up">▲</button>
            </div>
            <div class="control-row">
                <button class="control-btn" data-dir="left">◀</button>
                <button class="control-btn" data-dir="down">▼</button>
                <button class="control-btn" data-dir="right">▶</button>
            </div>
        </div>
    </div>

    <!-- Error Handler -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const container = document.querySelector('.game-wrapper');
            let errorBox = document.getElementById('error-box');
            if (!errorBox) {
                errorBox = document.createElement('div');
                errorBox.id = 'error-box';
                errorBox.style.position = 'fixed';
                errorBox.style.bottom = '0';
                errorBox.style.left = '0';
                errorBox.style.width = '100%';
                errorBox.style.background = 'rgba(255, 0, 0, 0.8)';
                errorBox.style.color = 'white';
                errorBox.style.padding = '10px';
                errorBox.style.fontSize = '12px';
                errorBox.style.fontFamily = 'monospace';
                errorBox.style.zIndex = '1000';
                container.appendChild(errorBox);
            }
            errorBox.innerText = 'Error: ' + msg + ' at line ' + lineNo;
            return false;
        };
    </script>
    <script>
        (function () {
            const popup = document.getElementById('videoPopup');
            const header = document.getElementById('videoPopupHeader');
            const minimizeBtn = document.getElementById('videoMinimizeBtn');
            const closeBtn = document.getElementById('videoCloseBtn');
            const resizer = document.getElementById('videoResizer');
            if (!popup || !header || !minimizeBtn || !closeBtn) return;
            let dragOffset = { x: 0, y: 0 };
            
            let offsetX = 0;
            let offsetY = 0;
            let isDragging = false;
            
            const startDrag = (event) => {
                const target = event.target;
                // Prevent drag if touching buttons or resizer
                if (target.closest('button') || target.closest('.video-resizer')) return;

                isDragging = true;
                popup.classList.remove('pip-mode');
                const rect = popup.getBoundingClientRect();
                const clientX = event.clientX ?? (event.touches && event.touches[0].clientX);
                const clientY = event.clientY ?? (event.touches && event.touches[0].clientY);
                offsetX = clientX - rect.left;
                offsetY = clientY - rect.top;
                dragOffset = { ...popup.getBoundingClientRect() };
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchmove', onDrag, { passive: false });
                document.addEventListener('touchend', endDrag);
            };
            
            const onDrag = (event) => {
                if (!isDragging) return;
                // Don't prevent default on touch to allow scrolling if needed, 
                // but usually we want to prevent scrolling while dragging popup
                if (event.cancelable) event.preventDefault();
                
                const clientX = event.clientX ?? (event.touches && event.touches[0].clientX);
                const clientY = event.clientY ?? (event.touches && event.touches[0].clientY);
                
                // Ensure we stay within window bounds
                const currentWidth = popup.offsetWidth;
                const currentHeight = popup.offsetHeight;
                const maxX = window.innerWidth - currentWidth;
                const maxY = window.innerHeight - currentHeight;

                const nextX = Math.min(Math.max(clientX - offsetX, 0), Math.max(maxX, 0));
                const nextY = Math.min(Math.max(clientY - offsetY, 0), Math.max(maxY, 0));
                
                popup.style.left = `${nextX}px`;
                popup.style.top = `${nextY}px`;
                popup.style.right = 'auto';
                popup.style.bottom = 'auto';
                popup.dataset.dragX = nextX;
                popup.dataset.dragY = nextY;
            };
            
            const endDrag = () => {
                isDragging = false;
                document.removeEventListener('mousemove', onDrag);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchmove', onDrag);
                document.removeEventListener('touchend', endDrag);
            };
            
            header.addEventListener('mousedown', startDrag);
            header.addEventListener('touchstart', startDrag, { passive: false });
            
            const resetPopupPosition = () => {
                popup.style.left = '';
                popup.style.top = '';
                popup.style.right = '';
                popup.style.bottom = '';
                delete popup.dataset.dragX;
                delete popup.dataset.dragY;
            };

            minimizeBtn.addEventListener('click', () => {
                const isPip = popup.classList.toggle('pip-mode');
                minimizeBtn.setAttribute('aria-pressed', String(isPip));
                if (isPip) {
                    resetPopupPosition();
                    popup.style.width = '';
                    popup.style.height = '';
                    popup.style.transform = '';
                } else if (popup.dataset.dragX && popup.dataset.dragY) {
                    popup.style.left = `${popup.dataset.dragX}px`;
                    popup.style.top = `${popup.dataset.dragY}px`;
                }
            });
            
            closeBtn.addEventListener('click', () => {
                popup.style.display = 'none';
            });

            if (resizer) {
                const clampWidth = (value) => {
                    const min = 160;
                    const max = Math.min(520, window.innerWidth - 40);
                    return Math.min(Math.max(value, min), Math.max(min, max));
                };

                const startResize = (event) => {
                    popup.classList.remove('pip-mode');
                    const rect = popup.getBoundingClientRect();
                    const startWidth = rect.width;
                    const startX = event.clientX ?? (event.touches && event.touches[0].clientX);
                    if (startX == null) return;

                    const onResize = (moveEvent) => {
                        moveEvent.preventDefault();
                        const clientX = moveEvent.clientX ?? (moveEvent.touches && moveEvent.touches[0].clientX);
                        if (clientX == null) return;
                        const deltaX = clientX - startX;
                        const nextWidth = clampWidth(startWidth + deltaX);
                        popup.style.width = `${Math.round(nextWidth)}px`;
                        resetPopupPosition();
                    };

                    const stopResize = () => {
                        document.removeEventListener('mousemove', onResize);
                        document.removeEventListener('mouseup', stopResize);
                        document.removeEventListener('touchmove', onResize);
                        document.removeEventListener('touchend', stopResize);
                    };

                    document.addEventListener('mousemove', onResize);
                    document.addEventListener('mouseup', stopResize);
                    document.addEventListener('touchmove', onResize, { passive: false });
                    document.addEventListener('touchend', stopResize);
                };

                resizer.addEventListener('mousedown', startResize);
                resizer.addEventListener('touchstart', (event) => {
                    event.preventDefault();
                    startResize(event);
                }, { passive: false });
            }
        })();
    </script>
    <script src="game.js"></script>
</body>
</html>
